name: Check

# Every change is checked: package names, categories, no app twice, and
# dist/ built from the lists as they are. Nothing is updated here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/build.py --check
